# CI gate: ruff F821 + full pytest suite.
#
# - windows-latest is blocking — it is the production platform (the
#   daemon runs on a Windows workstation; win32-specific branches exist
#   in lsp/gateway.py and core/dispatcher.py).
# - ubuntu-latest exercises the non-win32 branches that never run
#   locally. Blocking since the win32-only tests gained platform
#   skipifs (first informational run: 3 failed / 1614 passed, all
#   three were tests of Windows-only contracts).
# - No Lean toolchain on runners. The one real-lake e2e
#   (tests/test_lemma_lookup.py::test_lookup_batch_real_lake) is marked
#   `real_lake` and OFF by default — conftest drops it from collection
#   unless ASTERISM_REAL_LAKE is set — so CI neither runs nor skips it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            blocking: true
          - os: ubuntu-latest
            blocking: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff F821, scope per pyproject)
        run: ruff check --no-cache Tooling
      - name: Tests
        run: pytest -q
