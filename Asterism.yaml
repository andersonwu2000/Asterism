# Asterism project config. All fields optional; missing keys fall back
# to env vars then built-in defaults. See docs/architecture.md §10 for
# the full resolution chain (env > Asterism.yaml > legacy env > built-in).
#
# Values shown are the framework's built-in defaults — uncomment + edit
# any entry to override. Leaving the file as-is is identical to deleting
# it; the framework only reads what's set.

dispatch:
  pool: 4                     # Max in-flight pipelines, also = number of
                              # persistent lean workers in the LSP gateway
                              # pool (1:1 binding — every spawn claims one
                              # dedicated worker for its lifetime, freed on
                              # release). Tune to workstation RAM budget.
                              #
                              # RAM breakdown (32 GB workstation, 2026-05-14
                              # PoC measured against real gateway):
                              #   ~1.2 GB  base         (lake serve + lean --server)
                              #   ~2.5 GB  mathlib mmap (shared across workers via
                              #                          kernel page cache;
                              #                          counted once when pool ≥ 1)
                              #   ~0.6 GB  per worker  (private elaboration heap;
                              #                         idle baseline, heavier
                              #                         under elaboration load)
                              #   ~0.35 GB per pool slot (claude pipeline WS;
                              #                          Private commit can reach
                              #                          ~1 GB but most not resident)
                              # Approximation:
                              #   RAM ≈ 3.7 + 0.95×pool  GB
  budget_sec: 86400           # 24hr daemon wall-clock cutoff (was 18000
                              # = 5hr; 7200 for miniF2F stress test, 16200
                              # for older SG baselines)
  shelve_threshold: 5         # total attempts per goal before shelving
                              # (was 4; SG 2026-05-09 g224 hit 4 stuck-thinking
                              # in a row with the old escape-less rescue
                              # prompt; with the new rescue prompt listing
                              # decline + leaf-bypass paths, give 1 more
                              # attempt to find an escape before shelving)
  spawn_timeout_sec: 960      # 16min/spawn. SG empirical: sonnet stuck-
                              # thinking eats any larger budget without
                              # tool_use, so the watchdog (trap_check_sec)
                              # still bounds genuine stalls.
#  postmortem_timeout_sec: 180  # F55 postmortem spawn budget (writes
                              # _progress.md after a main timeout).
  trap_check_sec: 660         # watchdog single check at 11min (≈5min rescue
                              # tail before the 960s spawn cutoff).
                              # Watchdog 2026-05-10 v4: single
                              # point-in-time check at this many
                              # seconds into the spawn. At trigger,
                              # kill iff BOTH conditions hold:
                              #   (1) parser.is_thinking_trap()
                              #       (mid-thinking OR finalized +
                              #        last_stop_reason=max_tokens)
                              #   (2) silence > silence_threshold_sec
                              # AND prevents false positives on
                              # active agents that briefly think.
                              # On kill → STUCK_THINKING → single
                              # combined fresh-sid takeover (budget
                              # = spawn_timeout + postmortem -
                              # trap_check = 420s default).
  silence_threshold_sec: 300  # Trap AND-condition silence threshold.
                              # silence = seconds since agent's last
                              # tool_use (or spawn start if no tool
                              # use yet). 300s tolerates s220-class
                              # active spawns (max gap 126s observed)
                              # and catches agents that have been
                              # silent through the entire window
                              # [trap_check - 300, trap_check].
  # classify is the ONE kind whose input is unbounded: it lays out the whole
  # kept-decl set (N) in a single thinking block, so its think time scales with
  # N. The flat trap_check_sec (calibrated for bounded builder/backward/migrate
  # spawns) killed residue's 271-decl classify mid-think (~650s > 660). For
  # classify ONLY, the watchdog trap_check = min(cap, trap_check_sec +
  # per_decl*N), and the overall spawn timeout keeps the same post-trap window
  # (spawn_timeout_sec - trap_check_sec). Other kinds are unaffected.
  # (librarian._classify_trap_budget; code defaults 4 / 2400 are the SoT.)
  classify_trap_per_decl_sec: 4    # +seconds of think budget per kept decl
  classify_trap_cap_sec: 2400      # ceiling (~435 decls; beyond this a one-shot
                                   # layout is the wrong shape, not a time issue)


builder:
  provider: claude
  model: claude-sonnet-5      # next-gen sonnet upgrade of the bulk proving
                              # worker (2026-07-02, CLI + stream-json verified).
                              # Was claude-sonnet-4-6. HIGHEST-volume pipeline —
                              # WATCH cost/latency; sonnet-5 pricing not yet
                              # benchmarked here. Revert to sonnet-4-6 if it
                              # regresses.
  threshold: 2                # builder→backward escalation at 2 attempts
                              # (was 3; tighter with the 900s spawn timeout
                              # below)

backward:
  provider: claude
  model: claude-opus-4-8

strategist:
  provider: claude
  model: claude-opus-4-8        # Planning is the highest-leverage spawn: one
                               # decomposition shapes the whole proof tree, so
                               # it gets the strongest available model. Fable 5
                               # (Mythos, ~2x Opus) was the intended planner;
                               # dropped to Opus 4.8 while that tier was down
                               # (2026-06-13) and RESTORED here on its return
                               # (2026-07-02, CLI-verified). Lowest-volume
                               # pipeline, so cost is negligible regardless.
                               # (InitializeDefs / RequestUserAmend / Inject.)
  interval_min: 120.0          # T1 routine cadence (default 60min)
#  inject_batch_max: 10        # Phase 2.5 — upper bound on
                               # Inject(briefs=[...]) length. Each
                               # brief becomes a Forward dispatch; >cap
                               # is rejected at verify_decision time.
                               # N=1 (single-Forward Inject) is always
                               # allowed regardless of cap.

forward:
  provider: claude
  model: claude-opus-4-8       # writes one Mathlib-style lemma per
                               # spawn; needs strong typing + library
                               # knowledge.

# target-1 per-node pre-search: before each goal is dispatched, a lightweight
# agent searches Mathlib (loogle) + Library + in-problem siblings for relevant
# lemmas, the framework #check-verifies them, and a ranked `## Candidate lemmas`
# section is injected into the prover's Context. One EXTRA spawn per node — a
# light "search + propose names" task, so a cheaper model is usually enough.
presearch:
  enabled: true                # off → skip pre-search (provers grep on their own)
  provider: claude
  model: claude-haiku-4-5      # A/B 2026-06-29: sonnet TIMED OUT at the 150s presearch
                               # budget (27 searches, still missed the Library lemma at the
                               # root) → strictly worse than haiku here. Reverted. The
                               # root-level Library miss is a coverage problem a bigger model
                               # did not fix; prover-variance dominated the run outcome.
                               # haiku tested 2026-06-29 (proj_nonexpansive): ~141s/node.
  timeout_sec: 240             # per-node pre-search budget (was 150). The 3-source search
                               # (in-problem + Library + Mathlib loogle) takes longer than the
                               # old Mathlib-only pass; 150s killed haiku mid-Mathlib before it
                               # wrote output (3-block run 2026-06-29). Blocks prover dispatch,
                               # so raising it adds per-node latency — tune to taste.

# Library-ization cleanup spawns (mark / simplify / decide / audit / migrate
# hole-fill — all dispatch with kind="librarian"). Was implicit: with no entry
# here, resolve_model("librarian") fell through to DEFAULT_MODEL (sonnet). Made
# explicit so the model is yaml-controlled like every other pipeline. (classify
# is a separate kind="classify"; it shares this default unless given its own
# entry.)
librarian:
  provider: claude
  model: claude-sonnet-5       # bulk, mechanical-ish per-file polish; the
                               # highest-volume librarian spawns. Upgraded from
                               # claude-sonnet-4-6 to next-gen sonnet-5
                               # (2026-07-02, CLI-verified). WATCH cost/latency
                               # (sonnet-5 pricing not yet benchmarked); revert
                               # to sonnet-4-6 if the bulk cost regresses.

# Developer-only agent framework-feedback questionnaire. Off by default.
# When on: survivor agents append one sentence (friction / suggestion /
# critique) to docs/internal/agent_feedback.md (piggybacks the reflection
# spawn — no extra spawn), and the framework writes a death-cause line for
# agents that died without a resumable session. The output file is under the
# gitignored docs/internal/, so a shared checkout neither has it nor triggers
# it. Survivor reports require reflection on (lessons.reflection_enabled,
# default on); death-cause writes are independent.
feedback:
  enabled: true                # set true in dev to collect framework feedback

scholar:
  model: claude-opus-4-8