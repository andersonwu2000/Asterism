# Asterism project config. All fields optional; missing keys fall back
# to env vars then built-in defaults. See docs/architecture.md §10 for
# the full resolution chain (env > Asterism.yaml > legacy env > built-in).
#
# Values shown are the framework's built-in defaults — uncomment + edit
# any entry to override. Leaving the file as-is is identical to deleting
# it; the framework only reads what's set.

dispatch:
  pool: 4                # ThreadPoolExecutor workers
                         # (LSP swap: each spawn may start an LSP MCP
                         # server ~5 GB; pool=4 caps RAM peak ~20 GB)
#   budget_sec: 1800      # daemon wall-clock cutoff (30 min)
  shelve_threshold: 4    # total attempts per goal before shelving
                         # (cantor_xi run had 6 timeouts; reduced from
                         # 8 to fail-fast on stuck goals at 4 retries)

builder:
  provider: claude
  model: claude-sonnet-4-6
  threshold: 2           # builder→backward escalation at 2 attempts
                         # (was 3; tighter with the 900s spawn timeout
                         # below)

backward:
  provider: claude
  model: claude-sonnet-4-6
