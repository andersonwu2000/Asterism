# Asterism project config. All fields optional; missing keys fall back
# to env vars then built-in defaults. See docs/architecture.md §10 for
# the full resolution chain (env > Asterism.yaml > legacy env > built-in).
#
# Values shown are the framework's built-in defaults — uncomment + edit
# any entry to override. Leaving the file as-is is identical to deleting
# it; the framework only reads what's set.

dispatch:
  quota_wait: true
  pool: 4                     # Max in-flight pipelines, also = number of
                              # persistent lean workers in the LSP gateway
                              # pool (1:1 binding — every spawn claims one
                              # dedicated worker for its lifetime, freed on
                              # release). Tune to workstation RAM budget.
                              #
                              # RAM breakdown (32 GB workstation, 2026-05-14
                              # PoC measured against real gateway):
                              #   ~1.2 GB  base         (lake serve + lean --server)
                              #   ~2.5 GB  mathlib mmap (shared across workers via
                              #                          kernel page cache;
                              #                          counted once when pool ≥ 1)
                              #   ~0.6 GB  per worker  (private elaboration heap;
                              #                         idle baseline, heavier
                              #                         under elaboration load)
                              #   ~0.35 GB per pool slot (claude pipeline WS;
                              #                          Private commit can reach
                              #                          ~1 GB but most not resident)
                              # Approximation:
                              #   RAM ≈ 3.7 + 0.95×pool  GB
  budget_sec: 86400           # 24hr daemon wall-clock cutoff (was 18000
                              # = 5hr; 7200 for miniF2F stress test, 16200
                              # for older SG baselines)
  shelve_threshold: 5         # total attempts per goal before shelving
                              # (was 4; SG 2026-05-09 g224 hit 4 stuck-thinking
                              # in a row with the old escape-less rescue
                              # prompt; with the new rescue prompt listing
                              # decline + leaf-bypass paths, give 1 more
                              # attempt to find an escape before shelving)
  spawn_timeout_sec: 1800     # 30min/spawn (was 960). 2026-08-11: the
                              # union_closed run died on the clock, not on
                              # the mathematics — 29 of 55 goal-level deaths
                              # were timeout or stuck-thinking, 7 were a
                              # mathematical verdict. g7491's killed spawn
                              # had oriented, written patch.lean and run
                              # three validate_file cycles inside 4.5min,
                              # then hit its first long think. The watchdog
                              # is what bounds genuine stalls (trap_check at
                              # 660s, plus the timeout path's own parser
                              # check); this number only decides how much
                              # room real work gets before them.
#  postmortem_timeout_sec: 180  # F55 postmortem spawn budget (writes
                              # _progress.md after a main timeout).
  trap_check_sec: 660         # watchdog single check at 11min (≈5min rescue
                              # tail before the 960s spawn cutoff).
                              # Watchdog 2026-05-10 v4: single
                              # point-in-time check at this many
                              # seconds into the spawn. At trigger,
                              # kill iff BOTH conditions hold:
                              #   (1) parser.is_thinking_trap()
                              #       (mid-thinking OR finalized +
                              #        last_stop_reason=max_tokens)
                              #   (2) silence > silence_threshold_sec
                              # AND prevents false positives on
                              # active agents that briefly think.
                              # On kill → STUCK_THINKING → single
                              # combined fresh-sid takeover (budget
                              # = spawn_timeout + postmortem -
                              # trap_check = 420s default).
  silence_threshold_sec: 300  # Trap AND-condition silence threshold.
                              # silence = seconds since agent's last
                              # tool_use (or spawn start if no tool
                              # use yet). 300s tolerates s220-class
                              # active spawns (max gap 126s observed)
                              # and catches agents that have been
                              # silent through the entire window
                              # [trap_check - 300, trap_check].
  # classify is the ONE kind whose input is unbounded: it lays out the whole
  # kept-decl set (N) in a single thinking block, so its think time scales with
  # N. The flat trap_check_sec (calibrated for bounded builder/backward/migrate
  # spawns) killed residue's 271-decl classify mid-think (~650s > 660). For
  # classify ONLY, the watchdog trap_check = min(cap, trap_check_sec +
  # per_decl*N), and the overall spawn timeout keeps the same post-trap window
  # (spawn_timeout_sec - trap_check_sec). Other kinds are unaffected.
  # (librarian._classify_trap_budget; code defaults 4 / 2400 are the SoT.)
  classify_trap_per_decl_sec: 4    # +seconds of think budget per kept decl
  classify_trap_cap_sec: 2400      # ceiling (~435 decls; beyond this a one-shot
                                   # layout is the wrong shape, not a time issue)


# Formalizer — the merged worker (update_plan_2026_07 #1): one kind
# covers prove / split / mint; the per-role model split (builder=cheap,
# backward=strong) is gone with the routing, so this single knob prices
# EVERY worker spawn. sonnet-5 (user ruling 2026-07-29): the opus tier
# stays on strategist/adversary where one decision shapes the tree.
formalizer:
  # 2026-08-15: union_closed goes back on codex (user), now on a 20x
  # subscription of its own. luna at `xhigh` does the throughput work;
  # the NL layer takes `sol`. Baseline: provider: claude / model:
  # claude-sonnet-5
  provider: codex
  model: gpt-5.6-luna
  reasoning_effort: xhigh
  # 2026-08-13: back off codex after the smoke run. The seat is proven
  # on codex (Test.provider_probe: brick proved, seven-tool roll-call
  # recorded, intake sentinel written) — restore with
  #   provider: codex / model: gpt-5.6-luna / reasoning_effort: xhigh
  # `reasoning_effort` is codex-only; claude derives its thinking budget
  # per spawn from the wall clock.
  # Seat choice is routine; the durable fact is WHY this seat is
  # expensive on agy. Measured 2026-08-10 — and NOT for the reason first
  # written here: agy does have a cache and reports it (`cache_read_tokens`,
  # excluded from `total_tokens` exactly as on claude).
  #   claude formalizer, per spawn:  11k fresh /  846k cached  (1.3% fresh)
  #   agy formalizer, worst spawn:  844k fresh / 12.5M cached  (6.3% fresh)
  # The hit rate is ~5x worse, but the dominant term is CHURN: that spawn
  # moved 13.4M tokens of context against claude's 857k. A formalizer
  # edits, validates, re-reads and edits again; a Strategist wake reads
  # once and decides, which is why the same model felt cheap on the NL
  # layer. `dispatch.pool: 4` multiplies it, and with no liveness clock
  # (#182) a spawn that stops making progress still runs to its timeout —
  # two did, 964s each.
  # # provider: antigravity
  # # model: gemini-3.6-flash-high
                               # SG-mirror layout (user 2026-08-06, second half
                               # of the Frankl run): Gemini does the
                               # throughput work — write the Lean for a brief
                               # the NL layer already argued and the judge
                               # already passed. Its recorded failure mode is
                               # asserting its own unchecked mathematics,
                               # which this seat never asks for. Precedent:
                               # the 2026-07-30 SG run on exactly this split
                               # closed in 91m32s with zero dead attempts.

strategist:
  # 2026-08-15: codex for the cache-hit probe (user). FIRST TIME ON THE
  # NL LAYER for this backend — the seat has only ever been a formalizer
  # here. Two things are known to be different up here and neither is a
  # blocker: `capabilities.liveness_clock` hands an NL kind on codex
  # TIMEOUT_ONLY (codex emits no text deltas, so the stream-idle clock
  # cannot be built), and this worker has no Read/Grep at all — it
  # reaches every file through the `inspect` MCP tool.
  # Baseline: claude / claude-opus-5.
  provider: codex
  model: gpt-5.6-sol
  reasoning_effort: high   # user 2026-08-15: sol does not need xhigh to
                           # hold the NL layer; luna keeps xhigh below.
  # Back on the opus tier 2026-08-06 after the
  # Gemini author hit its ceiling on the open
                               # segment: g382 rev 3 burned all 10 rounds and
                               # the whole wake on a FALSE briefed theorem
                               # (`5|K| <= 2*sum|K_x|`, refuted by the path
                               # configuration), re-skinned three times without
                               # checking it against a small case. Gemini's
                               # earlier win (Gilmer 1/100, 33 bricks, zero
                               # dead attempts) stands — the ceiling is the
                               # open segment, not the model.
  # model: claude-fable-5      # Planning is the highest-leverage spawn: one
                               # decomposition shapes the whole proof tree, so
                               # it gets the strongest available model. Fable 5
                               # (Mythos, ~2x Opus) was always the intended
                               # planner; dropped to Opus 4.8 while that tier
                               # was down (2026-06-13), and the 2026-07-02
                               # "restore" only reached Opus 5. Actually on
                               # Fable since 2026-08-02 (SLC — a real open
                               # conjecture is where the planner tier pays),
                               # CLI-verified the same day. Lowest-volume
                               # pipeline, so cost is negligible regardless.
                               # (InitializeDefs / RequestUserAmend / Inject.)
  interval_min: 120.0          # T1 routine cadence (default 120min; belief audit rides every routine wake)
  verify_retry: 10             # rounds a proposal may be revised before it is
                               # discarded (code default 6). A deep result is
                               # argued over many rounds — that is what the
                               # exchange is for, not a sign the author should
                               # be replaced. Cost is ~1 Strategist + 1
                               # Adversary spawn per round (user call 07-31).
#  inject_batch_max: 10        # Phase 2.5 — upper bound on
                               # Inject(briefs=[...]) length. Each
                               # brief becomes a Forward dispatch; >cap
                               # is rejected at verify_decision time.
                               # N=1 (single-Forward Inject) is always
                               # allowed regardless of cap.

# (builder/backward/forward sections retired with the Formalizer merge —
# mint jobs ride formalizer.model too.)

# target-1 per-node pre-search: before each goal is dispatched, a lightweight
# agent searches Mathlib (loogle) + Library + in-problem siblings for relevant
# lemmas, the framework #check-verifies them, and a ranked `## Candidate lemmas`
# section is injected into the prover's Context. One EXTRA spawn per node — a
# light "search + propose names" task, so a cheaper model is usually enough.
presearch:
  enabled: true                # off → skip pre-search (provers grep on their own)
  # Moves with the formalizer: `quota.BOUND` ties {presearch,
  # formalizer}, so a split pair stops on one seat's window.
  provider: claude
  model: claude-sonnet-5
  # 2026-08-15: back to sonnet. haiku landed the probe brick but
  # dropped the brief's secondary written requirements, and on a
  # real board that shows up as commit-gate rework, not as a
  # failure to prove — too expensive to discover on union_closed
  # (user call). agy A/B baseline: antigravity / gemini-3.7-flash-medium — A/B 2026-06-29: sonnet TIMED OUT at the 150s presearch
                               # budget (27 searches, still missed the Library lemma at the
                               # root) → strictly worse than haiku here. Reverted. The
                               # root-level Library miss is a coverage problem a bigger model
                               # did not fix; prover-variance dominated the run outcome.
                               # haiku tested 2026-06-29 (proj_nonexpansive): ~141s/node.
  timeout_sec: 240             # per-node pre-search budget (was 150). The 3-source search
                               # (in-problem + Library + Mathlib loogle) takes longer than the
                               # old Mathlib-only pass; 150s killed haiku mid-Mathlib before it
                               # wrote output (3-block run 2026-06-29). Blocks prover dispatch,
                               # so raising it adds per-node latency — tune to taste.

# Library-ization cleanup spawns (mark / simplify / decide / audit / migrate
# hole-fill — all dispatch with kind="librarian"). Was implicit: with no entry
# here, resolve_model("librarian") fell through to DEFAULT_MODEL (sonnet). Made
# explicit so the model is yaml-controlled like every other pipeline. (classify
# is a separate kind="classify"; it shares this default unless given its own
# entry.)
librarian:
  provider: claude
  model: claude-sonnet-5       # bulk, mechanical-ish per-file polish; the
                               # highest-volume librarian spawns. Upgraded from
                               # claude-sonnet-4-6 to next-gen sonnet-5
                               # (2026-07-02, CLI-verified). WATCH cost/latency
                               # (sonnet-5 pricing not yet benchmarked); revert
                               # to sonnet-4-6 if the bulk cost regresses.

# Developer-only agent framework-feedback questionnaire. Off by default.
# When on: survivor agents append one sentence (friction / suggestion /
# critique) to docs/internal/agent_feedback.md (piggybacks the reflection
# spawn — no extra spawn), and the framework writes a death-cause line for
# agents that died without a resumable session. The output file is under the
# gitignored docs/internal/, so a shared checkout neither has it nor triggers
# it. Survivor reports require reflection on (lessons.reflection_enabled,
# default on); death-cause writes are independent.
feedback:
  enabled: true                # re-enabled for the Formalizer e2e acceptance (user 2026-07-29); the ~15-30s questionnaire resume per spawn is acceptable in dev runs

scholar:
  model: claude-sonnet-5

adversary:
  # 2026-08-15: codex for the cache-hit probe (user) — the judge follows
  # its author, as the A/B rule below requires, so the NL layer stays one
  # variable. Also first time on this seat for this backend.
  # Baseline: claude / claude-opus-5.
  provider: codex
  model: gpt-5.6-sol
  reasoning_effort: high   # matches the author, as the A/B rule below
                           # requires — one variable on the NL layer.
  # 2026-08-13: back on fable (user). The 08-12 detour to opus-5 was
  # only because fable's weekly window was spent and the ledger BINDs
  # {strategist, adversary} — a blocked judge stops the pair.
  # A/B arm: the judge matches the author here so the NL layer is
  # one variable, not two. BOUND to the strategist.
  # 2026-08-10 (user): the strongest model goes to
                               # the judge, not the planner. The rule below
                               # still holds — a judge ABOVE its author
                               # satisfies it — and the reason to prefer this
                               # allocation is that a bad PLAN has a downstream
                               # catch (`verify_retry: 10` exists for exactly
                               # that) while a bad JUDGEMENT has none: the
                               # kernel checks Lean, not the natural-language
                               # argument, so this is the one seat with no
                               # second opinion.
                               # It is also the cheap place to spend Fable.
                               # Measured 07-06..08-08: strategist 1,899 spawns
                               # / 40.9M output tokens, adversary 535 / 11.7M —
                               # ~29%. Fable's weekly cap is what stalled the
                               # 08-06 run while it sat on the PLANNER seat.
                               # WATCH IN THE FIRST RUN: a judge stronger than
                               # its author can reject faster than the author
                               # repairs, burning all ten rounds with nothing
                               # landed (the 07-31 shape). The signal is rounds
                               # per batch, not pass rate.
  # model: claude-opus-5       # The judge is the only gate on the argument
                               # layer, so it must not sit below the author.
                               # The 2026-08-02 seeded-defect probe showed
                               # criterion 3 hard at a MODERATE difficulty
                               # band (3/3, `_spike/judge_lean_probe.py`) on
                               # exactly this model; re-run 2026-08-06 after
                               # the strategist moved to Gemini reproduced it
                               # (D1/D2 fired, D3 detected to the monomial).
                               # gemini-3.6-flash-high scored 1/3 on the same
                               # harness — it reads statements, not arguments
                               # — so the judge seat stays claude. Fable's
                               # weekly cap is also what stalled the 08-06
                               # run; opus draws on the shared window.
                               # Lowest-volume pipeline — cost negligible.