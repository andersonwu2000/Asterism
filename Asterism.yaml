# Asterism project config. All fields optional; missing keys fall back
# to env vars then built-in defaults. See docs/architecture.md §10 for
# the full resolution chain (env > Asterism.yaml > legacy env > built-in).
#
# Values shown are the framework's built-in defaults — uncomment + edit
# any entry to override. Leaving the file as-is is identical to deleting
# it; the framework only reads what's set.

dispatch:
  pool: 15                    # ThreadPoolExecutor workers (= max in-flight
                              # pipelines). With Phase 2 LSP gateway, RAM
                              # cost per spawn is just claude.exe (~330 MB);
                              # worker pool RAM is bounded by gateway.workers
                              # below, so pool can scale higher than
                              # gateway.workers.
  budget_sec: 16200           # 4h30min daemon wall-clock cutoff for SG run
  shelve_threshold: 5         # total attempts per goal before shelving
                              # (was 4; SG 2026-05-09 g224 hit 4 stuck-thinking
                              # in a row with the old escape-less rescue
                              # prompt; with the new rescue prompt listing
                              # decline + leaf-bypass paths, give 1 more
                              # attempt to find an escape before shelving)
  spawn_timeout_sec: 900      # 15min per-spawn wall budget. SG empirical
                              # showed sonnet stuck-thinking on hard sub-goals
                              # eats most of any larger budget without
                              # emitting tool_use; tighter watchdog cap
                              # (720s = 12min) → rescue path engages sooner.
#  postmortem_timeout_sec: 180  # F55 postmortem spawn budget (writes
                              # _progress.md after a main timeout).
  rescue_timeout_sec: 240     # gates two things:
                              # (a) watchdog wall-cap math (kill at
                              #     `spawn_timeout - rescue_timeout`,
                              #     leaves room for stage 2 + stage 3
                              #     fresh-rescue spawns within budget).
                              # (b) fresh-rescue stage 2 budget (the
                              #     ship-or-bail spawn after thinking-
                              #     trap, takes over the original
                              #     session's rescue stage).
                              # Stage 3 (postmortem replacement) uses
                              # `postmortem_timeout_sec` instead.
                              # Watchdog 2026-05-10 v3 redesign: at
                              # wall_cap, the watchdog samples the
                              # stream parser's state (mid-thinking
                              # OR finalized+max_tokens → trap → kill
                              # → fresh-sid stage 2/3). No silence
                              # threshold (the prior idle_window_sec
                              # mechanism was retired with the
                              # stream-json switch).

gateway:                       # Phase 2 LSP gateway (Tooling/lsp_gateway.py)
  workers: 3                  # Persistent lean workers in the pool. Each is
                              # ~3 GB Mathlib elaborated state. RAM ≈ 1.6 +
                              # 3.0×workers + 0.33×pool. Tune to RAM budget;
                              # tool-call queue depth grows when pool>>workers
                              # (each cache miss ~3-4s, see
                              # docs/dev/lsp_gateway.md §6).
#  port: 8765                  # HTTP MCP endpoint. Change only on conflict.

builder:
  provider: claude
  model: claude-sonnet-4-6
  threshold: 2                # builder→backward escalation at 2 attempts
                              # (was 3; tighter with the 900s spawn timeout
                              # below)

backward:
  provider: claude
  model: claude-sonnet-4-6
