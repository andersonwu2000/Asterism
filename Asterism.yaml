# Asterism project config. All fields optional; missing keys fall back
# to env vars then built-in defaults. See docs/architecture.md §10 for
# the full resolution chain (env > Asterism.yaml > legacy env > built-in).
#
# Values shown are the framework's built-in defaults — uncomment + edit
# any entry to override. Leaving the file as-is is identical to deleting
# it; the framework only reads what's set.

# dispatch:
#   pool: 4               # ThreadPoolExecutor workers
#   budget_sec: 1800      # daemon wall-clock cutoff (30 min)
#   builder_threshold: 3  # attempts per goal before switching to Backward
#   shelve_threshold: 8   # attempts per goal before shelving
#                         # weak-tier models (Haiku/Flash/mini): try (5, 10)

# builder:
#   provider: claude      # claude | gemini | openai
#   model: claude-sonnet-4-6

# backward:
#   provider: claude
#   model: claude-sonnet-4-6

# Examples ------------------------------------------------------------
#
# Cheap Builder + strong Backward (mix providers in one daemon run):
#   builder:  { provider: claude, model: claude-haiku-4-5 }
#   backward: { provider: claude, model: claude-opus-4-7  }
#   dispatch: { builder_threshold: 5, shelve_threshold: 10 }
#
# Pure Gemini run (free-tier flash):
#   builder:  { provider: gemini, model: gemini-2.5-flash }
#   backward: { provider: gemini, model: gemini-2.5-flash }
#
# env always wins for one-off override:
#   ASTERISM_BUILDER_MODEL=claude-opus-4-7 python -m Tooling.cli run
