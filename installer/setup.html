<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up Asterism</title>
<!-- The first-run setup wizard, served by setup-server.ps1 (NOT the
     engine — the engine is just one thing this installs). Same origin
     as its little server, so it uses normal fetch: GET /status to see
     what's here, POST /install to begin, GET /progress to watch. When
     everything is ready it hands off to the console on :8642. -->
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0c; color: #ededf0;
    font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .wrap { max-width: 44rem; width: 92%; padding: 3rem 2rem; }
  .head { text-align: center; }
  .mark { font-size: 14px; letter-spacing: .35em; color: #9da0a8; text-transform: uppercase; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 28px; margin: .9rem 0 .5rem; }
  p { color: #a2a4ab; margin: .3rem 0; }
  .sky { margin: 1.5rem auto .2rem; width: 150px; display: block; }
  .star { animation: tw 2.4s ease-in-out infinite; }
  .star.b { animation-delay: .8s; } .star.c { animation-delay: 1.6s; }
  @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .card { margin-top: 1.6rem; border: 1px solid #1e1e24; border-radius: 10px;
          background: #101014; padding: 1.1rem 1.3rem; }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6a6c72; }
  .choice { display: flex; gap: 1.4rem; margin: .7rem 0 .2rem; font-size: 13px; }
  .choice label { display: inline-flex; align-items: center; gap: .4rem; color: #c9cbd0; cursor: pointer; }
  input[type=radio] { accent-color: #a2a4ab; }
  input[type=text] { width: 24rem; max-width: 100%; background: #0a0a0c; border: 1px solid #1e1e24;
                     border-radius: 5px; color: #ededf0; padding: .3rem .5rem; font: 12px "Consolas", monospace; }
  input[type=text]:focus { outline: none; border-color: #67696f; }
  select { background: #0a0a0c; border: 1px solid #1e1e24; border-radius: 5px; color: #ededf0;
           padding: .3rem .5rem; font: 12px "Consolas", monospace; }
  .btn { margin-top: 1.1rem; border: none; border-radius: 6px; background: #ededf0; color: #0a0a0c;
         font: 600 13px "Segoe UI", sans-serif; padding: .5rem 1.1rem; cursor: pointer; }
  .btn:hover { background: #f4f5f8; }
  .btn:disabled { opacity: .5; cursor: default; }
  .hint { color: #67696f; font-size: 12px; margin-left: .8rem; }
  /* the one move only the user can make - kept out of the collapsible
     rows so it can't hide in a closed log */
  .human { margin: 0 0 1.1rem; padding: .7rem 1rem; border: 1px solid #2a2a30; border-radius: 8px;
           background: #141418; color: #f2f3f6; font-size: 13px; }
  /* install checklist: one row per target, click to expand its log */
  .checklist { margin-top: .1rem; }
  .item { border-top: 1px solid #17171b; }
  .item:first-child { border-top: none; }
  .ihead { display: flex; align-items: center; gap: .7rem; padding: .55rem .2rem; cursor: pointer;
           user-select: none; border-radius: 5px; }
  .ihead:hover { background: #0e0e12; }
  .g { width: 1.15em; flex: none; text-align: center; font-size: 12px; }
  .g.pend { color: #46474d; } .g.done { color: #ededf0; } .g.warn { color: #f2f3f6; font-weight: 700; }
  .g.run .pulse { margin: 0; }
  .iname { color: #c9cbd0; font-size: 13px; }
  .item.pending .iname { color: #6a6c72; }
  .item.done .iname { color: #9da0a8; }
  .istat { margin-left: auto; color: #67696f; font-size: 12px; font-family: "Consolas", monospace;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56%; }
  .item.running .istat { color: #a2a4ab; }
  .chev { flex: none; margin-left: .3rem; color: #46474d; transition: transform .15s ease; }
  .item.open .chev { transform: rotate(90deg); }
  .ilog { display: none; max-height: 15rem; overflow-y: auto; margin: 0 0 .5rem 1.85rem;
          padding: .45rem .7rem; background: #0c0c10; border-left: 1px solid #1a1a1f; border-radius: 4px;
          font: 12px/1.7 "Cascadia Code", "Consolas", monospace; }
  .item.open .ilog { display: block; }
  .ilog .ln { white-space: pre-wrap; word-break: break-word; color: #8a8d94; }
  .ilog .ln.tick { color: #a2a4ab; }
  .pulse { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: #8a8d94;
           margin-right: .8em; vertical-align: middle; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="mark">Asterism</div>
      <h1>Set up Asterism</h1>
      <p id="lede">Checking what's already on this machine&hellip;</p>
      <svg class="sky" viewBox="0 0 160 60" aria-hidden="true">
        <path d="M20 44 L74 14 L128 36" stroke="#67696f" stroke-width="1" fill="none" opacity="0.4"/>
        <circle class="star a" cx="20" cy="44" r="3.4" fill="#f4f5f8"/>
        <circle class="star b" cx="74" cy="14" r="4.2" fill="#f4f5f8"/>
        <circle class="star c" cx="128" cy="36" r="2.8" fill="#f4f5f8"/>
      </svg>
    </div>
    <div id="decide" style="display:none"></div>
    <div id="progress" style="display:none">
      <div id="human" class="human" style="display:none"></div>
      <div class="lbl" style="margin-bottom:.3rem">Installing</div>
      <div id="checklist" class="checklist"></div>
      <div id="retry" style="display:none; margin-top:1rem">
        <button class="btn" id="retryBtn">Try the unfinished steps again</button>
        <span class="hint">finished parts are skipped</span>
      </div>
    </div>
  </div>
  <script>
    var ENGINE = 'http://127.0.0.1:8642/'
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;') }
    function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e }

    function allDone(s){
      return s.python.found && s.engine.present && s.git.found && s.lean.found &&
             s.mathlib.present && s.claude.installed && s.claude.logged_in
    }

    // ---- decisions view -------------------------------------------------
    function renderDecide(s){
      document.getElementById('lede').innerHTML =
        "A few dependencies, then one button. The only step that needs you is the Claude login &mdash; a browser tab opens; click Authorize."
      var d = document.getElementById('decide'); d.innerHTML=''; d.style.display=''
      var card = el('div','card')
      card.appendChild(el('div','lbl','Before it runs'))
      card.appendChild(el('div',null,'<div style="color:#a2a4ab;font-size:12.5px;margin:.4rem 0">Asterism lives at <span style="font-family:Consolas,monospace;color:#ededf0">'+esc(s.repo)+'</span> — the math library (~5 GB) lands here too</div>'))

      var needLean = !s.lean.found
      if (needLean){
        var ch = el('div','choice')
        ch.innerHTML =
          '<label><input type="radio" name="lean" value="install" checked> install Lean for me</label>'+
          '<label><input type="radio" name="lean" value="existing"> I already have Lean</label>'
        card.appendChild(ch)
        var sub = el('div',null,''); sub.style.margin='.2rem 0'
        sub.innerHTML =
          '<span id="leanInstall"><span style="color:#67696f;font-size:12px">Lean toolchain (~1 GB) goes to </span>'+
          '<select id="elan"><option value="'+esc(s.elan_home)+'">'+esc(s.elan_home)+' (default)</option></select></span>'+
          '<span id="leanExisting" style="display:none"><input id="lake" type="text" placeholder="path to lake.exe or its folder"></span>'
        card.appendChild(sub)
      } else {
        card.appendChild(el('div',null,'<div style="color:#6a6c72;font-size:12.5px;margin:.3rem 0">Lean: <span style="color:#8fb98f">found</span> &middot; <span style="font-family:Consolas,monospace">'+esc(s.lean.version||'')+'</span></div>'))
      }
      var btn = el('button','btn','Set up Asterism'); btn.id='go'
      var hint = el('span','hint','safe to press again at any time; finished parts are skipped')
      var bar = el('div',null,''); bar.style.cssText='margin-top:1rem'; bar.appendChild(btn); bar.appendChild(hint)
      card.appendChild(bar)
      d.appendChild(card)

      if (needLean){
        d.addEventListener('change', function(){
          var mode = (d.querySelector('input[name=lean]:checked')||{}).value
          document.getElementById('leanInstall').style.display = mode==='existing'?'none':''
          document.getElementById('leanExisting').style.display = mode==='existing'?'':'none'
        })
      }
      btn.onclick = function(){
        btn.disabled = true
        var body = { lean_mode:'install' }
        if (needLean){
          body.lean_mode = (d.querySelector('input[name=lean]:checked')||{}).value
          var elan = document.getElementById('elan'); if (elan) body.elan_home = elan.value
          var lake = document.getElementById('lake'); if (lake) body.lake_path = lake.value
        }
        decisions = body
        fetch('/install', { method:'POST', body: JSON.stringify(body) }).then(startProgress)
      }
    }

    // ---- progress view --------------------------------------------------
    // The flat log is parsed into one group per [STEP]; [PLAN] seeds the
    // whole roadmap up front so pending rows show before they start.
    var lastLines = [], openState = {}, decisions = null
    var GLYPH = {
      pending: '<span class="g pend">&#9675;</span>',
      running: '<span class="g run"><span class="pulse"></span></span>',
      done:    '<span class="g done">&#10003;</span>',
      warn:    '<span class="g warn">!</span>'
    }
    // Lines are [TAG|Step] payload (two install lanes interleave, so each
    // line names its own step); [PLAN]/[HUMAN] carry no step. Untagged
    // lines attach to the last step seen (a wrapped continuation line).
    function parseLog(lines){
      var order=[], groups={}, human=null, last=null
      function ensure(n){ if(!groups[n]){ groups[n]={name:n,status:'pending',detail:[],tick:null,stat:''}; order.push(n) } return groups[n] }
      for (var i=0;i<lines.length;i++){
        var m = /^\[(PLAN|STEP|OK|NOTE|WARN|TICK|HUMAN)(?:\|([^\]]*))?\]\s?([\s\S]*)$/.exec(lines[i])
        if(!m){ if(last) groups[last].detail.push(lines[i]); continue }
        var k=m[1], step=m[2], t=m[3]
        if(k==='PLAN'){ var ps=t.split('|'); for(var j=0;j<ps.length;j++) ensure(ps[j]); continue }
        if(k==='HUMAN'){ human=t; continue }
        var name = step || last
        if(!name) continue
        last = name
        var g = ensure(name)
        if(k==='STEP'){ if(g.status!=='done'&&g.status!=='warn') g.status='running'; g.tick=null }
        else if(k==='OK'){ g.status='done'; g.stat=t }
        else if(k==='WARN'){ g.status='warn'; g.detail.push(t); if(!g.stat) g.stat='needs attention' }
        else if(k==='NOTE'){ g.detail.push(t) }
        else if(k==='TICK'){ g.tick=t }
      }
      return {order:order, groups:groups, human:human}
    }
    // logs collapsed by default (the running row still shows its live
    // tick inline); only a failed step auto-opens so its error is seen
    function isOpen(g){ return (g.name in openState) ? openState[g.name] : (g.status==='warn') }
    function render(lines){
      lastLines = lines
      var p = parseLog(lines)
      var hb = document.getElementById('human')
      if(p.human){ hb.style.display=''; hb.innerHTML='<span class="pulse"></span>'+esc(p.human) } else { hb.style.display='none' }
      var box = document.getElementById('checklist'), html=''
      for (var i=0;i<p.order.length;i++){
        var g = p.groups[p.order[i]], open = isOpen(g)
        var inline = g.status==='running' ? esc(g.tick || (g.detail.length ? g.detail[g.detail.length-1].replace(/^\s+/,'') : 'working&hellip;'))
                   : g.status==='pending' ? '' : esc(g.stat)
        var detail=''
        if(open){
          var start = Math.max(0, g.detail.length - 140)
          if(start>0) detail += '<div class="ln">&hellip; '+start+' earlier line(s)</div>'
          for(var d=start; d<g.detail.length; d++) detail += '<div class="ln">'+esc(g.detail[d])+'</div>'
          if(g.status==='running' && g.tick) detail += '<div class="ln tick"><span class="pulse"></span>'+esc(g.tick)+'</div>'
        }
        html += '<div class="item '+g.status+(open?' open':'')+'" data-name="'+esc(g.name)+'">'
              +   '<div class="ihead">'+(GLYPH[g.status]||GLYPH.pending)
              +     '<span class="iname">'+esc(g.name)+'</span><span class="istat">'+inline+'</span>'
              +     '<span class="chev">&#8250;</span></div>'
              +   '<div class="ilog">'+detail+'</div></div>'
      }
      box.innerHTML = html
      var heads = box.querySelectorAll('.ihead')
      for (var h=0;h<heads.length;h++){
        heads[h].onclick = (function(g){ return function(){ openState[g.name] = !isOpen(g); render(lastLines) } })(p.groups[p.order[h]])
      }
      var run = box.querySelector('.item.running.open .ilog'); if(run) run.scrollTop = run.scrollHeight
    }
    function startProgress(){
      document.getElementById('lede').innerHTML = "Installing everything now &mdash; leave this page open. Open any row to watch its log."
      document.getElementById('decide').style.display='none'
      document.getElementById('retry').style.display='none'
      document.getElementById('progress').style.display=''
      poll()
    }
    function poll(){
      fetch('/progress').then(function(r){return r.json()}).then(function(p){
        render(p.log||[])
        if (p.state==='done'){ setTimeout(gotoEngine, 800); return }
        if (p.state==='failed'){ document.getElementById('retry').style.display=''; return }
        setTimeout(poll, 1000)
      }).catch(function(){ setTimeout(poll, 1500) })
    }
    document.getElementById('retryBtn').onclick = function(){
      openState = {}
      fetch('/install', { method:'POST', body: JSON.stringify(decisions||{lean_mode:'install'}) }).then(startProgress)
    }
    function gotoEngine(){
      // ask our own server (same origin) whether :8642 is listening - a
      // TCP check, so it needs no particular path to be served and no
      // cross-origin image load. Redirect the moment the console is up.
      fetch('/status').then(function(r){return r.json()}).then(function(s){
        if (s.engine_up){ location.replace(ENGINE); return }
        setTimeout(gotoEngine, 1200)
      }).catch(function(){ setTimeout(gotoEngine, 1500) })
    }

    // ---- boot -----------------------------------------------------------
    fetch('/status').then(function(r){return r.json()}).then(function(s){
      if (allDone(s) && s.engine_up){ location.replace(ENGINE); return }
      if (allDone(s)){
        // everything is installed, the console just isn't running (a
        // reboot, a later day) - re-fire the orchestrator: every step
        // skips and it brings the console up, then we hand off. Without
        // this, a stale 'done' marker left the page waiting on :8642
        // forever with nothing there to start it.
        fetch('/install', { method:'POST', body:'{}' }).then(startProgress)
        return
      }
      fetch('/progress').then(function(r){return r.json()}).then(function(p){
        // a finished ('done') log with components missing is stale -
        // fall through to the decisions view instead of watching it
        if (p.log && p.log.length && p.state !== 'done'){ startProgress() } else { renderDecide(s) }
      }).catch(function(){ renderDecide(s) })
    }).catch(function(){
      document.getElementById('lede').textContent = 'Waiting for the setup service...'
      setTimeout(function(){ location.reload() }, 2000)
    })
  </script>
</body>
</html>
