# Asterism packaging + tool config.
#
# Editable install is the supported mode (`pip install -e ".[dev]"`) — the
# framework needs the repo root at runtime (lakefile.lean, Problems/,
# Library/, Tooling/prompts/), so a wheel install is intentionally not a
# goal. This file exists to (a) pin dependencies, (b) expose the
# `asterism` console entry point, (c) centralize tool config (ruff,
# pytest) for CI and local runs.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asterism"
version = "0.1.0"
description = "LLM-orchestrated Lean 4 theorem-proving framework (AND/OR-graph BFS over Builder/Backward/Forward/Strategist agents)"
readme = "README.md"
requires-python = ">=3.12"
# Floors = versions in the 2026-06-10 dev environment (verified working).
#
# Ceilings = the next major, uniformly (a 0.x package's next major is 1).
# One rule, no per-package judgement. They exist because floors alone let
# CI resolve whatever PyPI happens to hold that hour: mcp 2.0.0 shipped
# 2026-07-28 without `mcp.server.fastmcp`, and the gate was red for two
# days on code that had not changed. A ceiling makes an upstream major an
# explicit decision (bump here, migrate, re-verify) instead of an outage.
#
# The cost is silence about what upstream is doing — .github/workflows/
# deps-drift.yml buys that signal back, unpinned and non-blocking.
dependencies = [
    "mcp>=1.27,<2",
    "starlette>=0.52,<1",
    "uvicorn>=0.42,<1",
    "fastapi>=0.115,<1",
    "PyYAML>=6.0,<7",
    "psutil>=7.2,<8",
    # papers/shelf.py PDF text extraction (lazy import; without it every
    # paper_fetch of a PDF dies ModuleNotFoundError — the cloud venv
    # shipped without it, 2026-08-24)
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    # `addopts = "-n auto"` below is not optional tuning — without xdist
    # installed pytest refuses the flag and exits 4 BEFORE collecting a
    # single test. That is how CI ran red from 2026-08-11 (e421b920 set
    # the flag, the extra did not follow) while the local suite, which
    # had xdist from somewhere else, stayed green: a config knob and the
    # dependency that makes it legal have to move together.
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
    # starlette/fastapi TestClient transport for tests/test_serve_api.py
    "httpx>=0.28,<1",
]

[project.scripts]
asterism = "Tooling.core.cli:main"

[tool.setuptools.packages.find]
# Explicit include: the repo root also holds Lean dirs (Problems/,
# Library/, Benchmarks/) and loose scripts (_bridge_scan.py, _ttime.py);
# setuptools flat-layout auto-discovery would refuse to guess.
include = ["Tooling*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# F821 only, matching tests/test_lint_undefined_names.py — a targeted,
# noise-free guard against NameError-class regressions ("real_mods"
# 2026-06-08). Widen the selection deliberately, not by default.
select = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: 3200 tests, 185s serial vs 46s under xdist with
# identical results (measured 2026-08-11) — the suite is xdist-safe by
# construction (per-test tmp_path / in-memory DBs, no fixed ports).
# Debugging a single test? `-n0` restores serial so -x / --pdb / print
# ordering behave.
addopts = "-n auto"
markers = [
    "real_lake: end-to-end test that spawns a live lake/lean toolchain (slow; only runnable where Mathlib is built). OFF by default — opt in with ASTERISM_REAL_LAKE=1 pytest, or pytest -m real_lake.",
    "free_cli_probe: may spawn a provider CLI for a probe that is answered locally (--version / an invalid --model / a nonexistent --resume id / an illegal -c enum value) — no API call, no tokens, no quota. ON by default (it skips itself where the CLI is absent); the side-effect fence checks the argv shape, not just the marker.",
    "slow: minute-scale check (whole-corpus scans, real clocks). OFF by default — opt in with ASTERISM_SLOW_TESTS=1 pytest, or pytest -m slow. (owner 2026-08-29: suite length is a cost)",
    "live_db: opts out of the live-data fence — the test legitimately opens the operator's own asterism.db / .asterism state. Rare by design: needing live run state is normally a missing monkeypatch.chdir(tmp_path).",
]
