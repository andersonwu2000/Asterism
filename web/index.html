<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterism</title>
    <script>
      // Before the first paint: a stored choice, else the system's.
      // Inline and synchronous on purpose — a module import lands
      // after layout, and a dark console flashing white on every load
      // is the one thing a theme switch must not do.
      (function () {
        try {
          var v = localStorage.getItem('asterism.theme')
          document.documentElement.dataset.theme =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
